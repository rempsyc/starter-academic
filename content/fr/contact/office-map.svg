<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1040" viewBox="250 120 2000 1300" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">UQAR — bureau U-1053</title>
  <desc id="desc">Plan d’orientation approximatif, non à l’échelle. Entrez du côté de la rue Notre-Dame, franchissez les deux séries de portes et tournez à gauche dès la sortie du vestibule. Suivez le couloir jusqu’à la porte du petit palier, puis prenez la porte de gauche vers le corridor des bureaux. Le bureau U-1053 est sur votre droite, près du début du long corridor. Tout le trajet se fait au même niveau.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M-2 2L2 -2M0 10L10 0M8 12L12 8" stroke="#d4d4d4" stroke-width="1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#24932c" />
    </marker>
  </defs>
  <style>
 text{font-family:Arial,sans-serif;fill:#151515}
 .outline{fill:url(#hatch);stroke:#171717;stroke-width:4;stroke-linejoin:round}
 .leader{fill:none;stroke:#333;stroke-width:2}
 .wall{fill:none;stroke:#222;stroke-width:6;stroke-linecap:square;stroke-linejoin:round}
 .door{fill:none;stroke:#777;stroke-width:2}
 .room{fill:#ededed}
 #office-plan rect{fill:#ededed;stroke:#333}
 .badge{fill:#fff;stroke:#111;stroke-width:2}
 .badge-number{font-size:23px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
